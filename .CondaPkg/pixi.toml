[dependencies]
openssl = ">=3, <3.6, >=3, <3.6"
libstdcxx = ">=3.4,<15.0, >=3.4,<15.0"
uv = ">=0.4"
libstdcxx-ng = ">=3.4,<15.0, >=3.4,<15.0"

    [dependencies.copernicusmarine]
    channel = "conda-forge"
    version = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cp*"
    version = ">=3.10,<3.14, >=3.10,<3.12, >=3.9,<4"

[project]
name = ".CondaPkg"
platforms = ["linux-64"]
channels = ["conda-forge"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"

[pypi-dependencies]
jax = ">=0.6"
xarray = ">=2024.7.0"
copernicusmarine = ">=2.0.0"
numpy = ">=2.0.0"
tensorflow = ">=2.17,>=2.17,<2.21"
