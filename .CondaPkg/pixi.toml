[dependencies]
openssl = ">=3, <3.6"
uv = ">=0.4"

    [dependencies.copernicusmarine]
    channel = "conda-forge"
    version = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cp*"
    version = ">=3.10,<3.14"

[project]
name = ".CondaPkg"
platforms = ["osx-arm64"]
channels = ["conda-forge"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"

[pypi-dependencies]
jax = ">=0.6"
xarray = ">=2024.7.0"
copernicusmarine = ">=2.0.0"
numpy = ">=2.0.0"
tensorflow = ">=2.17"
